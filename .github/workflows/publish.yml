# Publishes the `datadough` package with PyPI's trusted publishing (no API token stored anywhere).
# Off until the repository variable PYPI_PUBLISHING is "true": set it only after the steps in PUBLISHING.md.
#   - Run it by hand (Actions → publish → Run workflow) to publish to TestPyPI.
#   - Publishing a GitHub release publishes that version to PyPI.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: vars.PYPI_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The release tag must match the version in pyproject.toml
        if: github.event_name == 'release'
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "${{ github.event.release.tag_name }}" || {
            echo "Tag ${{ github.event.release.tag_name }} doesn't match version $version in pyproject.toml"; exit 1; }
      - run: uv run --locked pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: vars.PYPI_PUBLISHING == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # lets TestPyPI check this workflow is the trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: vars.PYPI_PUBLISHING == 'true' && github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI check this workflow is the trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
