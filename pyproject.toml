[project]
name = "datadough"
version = "1.4.0"
description = "Company financials from SEC filings, with every number traceable to its filing"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vedant Parashar", email = "vedantparashar18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
    "yfinance>=1.8.0",
]

[project.scripts]
finance-analyzer = "finance_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[tool.uv.build-backend]
# Published as "datadough", imported as finance_analyzer (the module's name since the start).
module-name = "finance_analyzer"

[tool.ruff]
line-length = 120
extend-exclude = ["data", "site"]

[tool.ruff.lint]
# Errors, import order, modern syntax, likely bugs (bugbear).
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # the formatter wraps code; what's left is long strings and table text
    "B905",  # zip() truncating is intended here (e.g. four page columns zipped with fewer cards)
]
